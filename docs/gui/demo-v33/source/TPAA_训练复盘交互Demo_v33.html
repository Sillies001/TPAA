/* ---- 回退重构版：仅补充清晰的选择器与分组菜单 ---- */

/* 页面高度由底部一行（含跨到底部的大面板）吸收 Ribbon 高度差 */
const RIBBON_DELTA=88;
function applyRibbonAdaptiveLayout(){
 const cv=$('#cv');if(!cv)return;
 const d=st.ribbonCollapsed?RIBBON_DELTA:0;
 const movable=[...cv.querySelectorAll('.selbar,.k4,.p,#ctl,#nzb,#pbn,.rp')];
 movable.forEach(el=>{el.style.setProperty('transform',d?`translateY(-${d}px)`:'','important');});
 /* 所有普通图表面板中，原本下边缘位于该页最低处的一行负责伸缩 */
 const panels=[...cv.querySelectorAll('.p')];
 if(panels.length){
   const geom=panels.map(el=>({el,top:parseFloat(el.style.top)||0,h:parseFloat(el.style.height)||0}));
   const maxBottom=Math.max(...geom.map(x=>x.top+x.h));
   geom.forEach(x=>{
     const flex=Math.abs((x.top+x.h)-maxBottom)<=12;
     x.el.classList.toggle('ribbon-flex-row',flex);
     if(d&&flex)x.el.style.height=(x.h+d)+'px';
   });
 }
 /* 报告页没有 .p：让报告纸自身承担伸缩，页脚保持在固定底边 */
 const rp=cv.querySelector('.rp');
 if(rp&&d){
   const base=Math.max(rp.scrollHeight,parseFloat(getComputedStyle(rp).height)||0);
   rp.style.minHeight=(base+d)+'px';
 }
 const ft=cv.querySelector('.ft');if(ft)ft.style.transform='';
}

function batchSummary(){const a=batchFilteredEvents();const cards=['WVR','BVR','STRIKE'].map(k=>{const xs=a.filter(e=>e.category===k),adj=xs.filter(e=>e.status==='已裁决').length,un=xs.length-adj,exc=xs.filter(e=>e.classificationException).length,hit=xs.filter(e=>/命中/.test(e.result)&&!/未命中/.test(e.result)).length;return `<button class=batchCatCard data-batch-category="${k}" style="--cat:${BATCH_CAT[k].color}"><div class=batchCatHead><b>${BATCH_CAT[k].label}</b><span>${k}</span></div><div class=batchCatCount>${xs.length}<small>发射事件</small></div><div class=batchCatFoot><span>已裁决 ${adj}</span><span>未裁决 ${un}</span><span>分类例外 ${exc}</span><span>裁决命中 ${hit}</span></div><div class=batchCatHint>点击筛选该类别 ↓</div></button>`}).join('');const clusters=new Set(a.map(e=>e.clusterId));const adjudicated=a.filter(e=>e.status==='已裁决').length;return `<div class=batchSummary><div class=batchOverall><div><span>当前筛选发射事件</span><b>${a.length}</b></div><div><span>关联攻击簇</span><b>${clusters.size}</b></div><div><span>已有正式裁决</span><b>${adjudicated}</b></div><div><span>待确认/未裁决</span><b>${a.length-adjudicated}</b></div></div><div class=batchCategoryCards>${cards}</div><div class=batchRule>归类规则：<b>武器类型为主</b> · 发射几何辅助校验 · 分类例外单独标注 · 不以几何自动覆盖武器类别</div></div>`}
function batchTimeline(){const a=batchFilteredEvents();const W=1480,H=132,left=156,right=18,top=15,bottom=12,x=t=>left+(t/90)*(W-left-right),lanes=['蓝方 A-03','蓝方 A-07','红方 R-01','红方 R-02','地面目标'];const laneOf=n=>n==='A-03'||n==='蓝方 A-03'?0:n==='A-07'||n==='蓝方 A-07'?1:n==='R-01'||n==='红方 R-01'?2:n==='R-02'||n==='红方 R-02'?3:4;let s='';lanes.forEach((n,i)=>{const y=top+12+i*21;s+=`<text x=145 y=${y+3} text-anchor="end" class="btLaneLabel">${n}</text><line x1=${left} x2=${W-right} y1=${y} y2=${y} class="btGrid"/>`});for(let t=0;t<=90;t+=10){const xx=x(t);s+=`<line x1=${xx} x2=${xx} y1=${top} y2=${H-bottom} class="btGrid"/><text x=${xx} y=${H-1} text-anchor="middle" class="btAxis">${String(9+Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}</text>`}
 a.forEach(e=>{const sy=top+12+laneOf(e.shooterAircraft)*21,ty=top+12+laneOf(e.targetAircraft)*21,xx=x(e.minute-9);const c=BATCH_CAT[e.category]?.color||'#8da2b8';const chosen=st.batch.selected===e.id;s+=`<g class="batchTimelineEvent ${chosen?'selected':''}" data-batch-pick="${e.id}" tabindex="0" role="button"><line x1=${xx} x2=${xx} y1=${sy} y2=${ty} stroke="${c}" stroke-width="${chosen?3:1.6}" opacity=".78"/><circle cx=${xx} cy=${sy} r=${chosen?6:4.5} fill="${c}" stroke="${chosen?'#fff':'none'}" stroke-width="1.2"/><circle cx=${xx} cy=${ty} r=${chosen?4.8:3.2} fill="none" stroke="${c}" stroke-width="1.5"/><title>${e.id} · ${e.weaponType} · ${e.shooter} → ${e.target}</title></g>`});return `<div class=batchTimelineWrap><div class=batchTimelineLegend><span><i style="background:${BATCH_CAT.WVR.color}"></i>视距内</span><span><i style="background:${BATCH_CAT.BVR.color}"></i>超视距</span><span><i style="background:${BATCH_CAT.STRIKE.color}"></i>对地攻击</span><span class=batchTimelineNote>实心点：发射方 · 空心点：目标侧 · 点击事件定位清单</span></div><svg class=batchTimelineSvg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg></div>`}
function batchEventRows(){const a=batchFilteredEvents();if(!a.length)return '<div class=batchEmpty>当前筛选条件下没有武器发射事件。</div>';return a.map(e=>{const c=BATCH_CAT[e.category],selected=st.batch.selected===e.id;return `<div class="batchEventRow ${selected?'selected':''}" data-batch-pick="${e.id}"><div class=batchEventTime>${e.time}<small>${e.id}</small></div><div class=batchEventMain><div class=batchEventTitle><b>${e.weaponType}</b><span class=batchPill style="--cat:${c.color}">${c.short} · ${c.label}</span>${e.classificationException?'<span class="batchPill exception">分类例外待确认</span>':''}</div><div class=batchEventRoute>${e.shooter} <span>→</span> ${e.target}<small>${batchRole(e)} · ${e.shooterSortie}</small></div></div><div class=batchEventMeta><b>${e.result}</b><small>攻击簇 ${e.clusterId} · 裁决 ${e.status} · 分类 ${e.classificationStatus}</small></div><div class=batchEventActions><button data-batch-open="${e.id}:single">单机复盘</button><button data-batch-open="${e.id}:team">编队复盘</button></div></div>`}).join('')}
function batchNoLaunchRows(){return BATCH_NO_LAUNCH.map(e=>`<div class=batchNoLaunchRow><b>${e.time}</b><span class=batchNoLaunchType>${e.kind}</span><strong>${e.unit}</strong><small>${e.detail}</small><em>仅批次态势 · 不单独评分</em></div>`).join('')}
function batchEventList(){const launch=st.batch.listMode==='launch';return `<div class=batchListTools><div class=batchListTabs><button class="${launch?'active':''}" data-batch-list-mode="launch">武器发射事件（${batchFilteredEvents().length}）</button><button class="${!launch?'active':''}" data-batch-list-mode="behavior">未发射行为（${BATCH_NO_LAUNCH.length}）</button></div><span>${launch?'每枚武器独立编号；齐射通过攻击簇关联':'探测、接敌、规避等仅保留在批次过程，不独立评分'}</span></div><div class=batchListScroll>${launch?batchEventRows():batchNoLaunchRows()}</div>`}

function openBatchEvent(eventId,scope){const e=batchEvent(eventId);st.batch.selected=e.id;st.batchPerspective=batchPerspectiveDefault(e);st.batch.perspective=st.batchPerspective;st.batchScope=scope;const c=BATCH_CAT[e.category]||BATCH_CAT.BVR;st.v=scope==='team'?c.team:c.single;st.h.push('V26');st.replayCourse=e.category;st.t=e.replaySec||0;const rail=SORTIE_EVENTS[st.v]||[];if(rail.length){let best=0,delta=Infinity;rail.forEach((x,i)=>{const d=Math.abs((x.t||0)-(e.replaySec||0));if(d<delta){delta=d;best=i}});st.eventSel[st.v]=best;}draw()}
document.addEventListener('change',e=>{const a=e.target.closest('[data-batch-filter]');if(!a)return;const k=a.dataset.batchFilter;st.batch[k]=a.value;if(k==='side'){st.batch.role='OUT';st.batch.aircraft='ALL';st.batch.sortie='ALL';st.batch.formation='ALL';}const visible=batchFilteredEvents();if(visible.length&&!visible.some(x=>x.id===st.batch.selected)){st.batch.selected=visible[0].id;}const ev=batchEvent(st.batch.selected);st.batch.perspective=batchPerspectiveDefault(ev);st.batchPerspective=st.batch.perspective;draw()});
document.addEventListener('click',e=>{
 const open=e.target.closest('[data-batch-open]');if(open){e.preventDefault();e.stopPropagation();const [id,scope]=open.dataset.batchOpen.split(':');openBatchEvent(id,scope);return;}
 const pick=e.target.closest('[data-batch-pick]');if(pick){batchSetCurrentEvent(pick.dataset.batchPick);draw();return;}
 const cat=e.target.closest('[data-batch-category]');if(cat){st.batch.category=cat.dataset.batchCategory;st.batch.listMode='launch';draw();return;}
 const mode=e.target.closest('[data-batch-list-mode]');if(mode){st.batch.listMode=mode.dataset.batchListMode;draw();return;}
 if(e.target.closest('[data-batch-reset]')){Object.assign(st.batch,{category:'ALL',role:'OUT',aircraft:'ALL',sortie:'ALL',formation:'ALL',status:'ALL'});const visible=batchFilteredEvents();if(visible.length)st.batch.selected=visible[0].id;st.batch.perspective=batchPerspectiveDefault(batchEvent(st.batch.selected));st.batchPerspective=st.batch.perspective;draw();return;}
 const perspective=e.target.closest('[data-batch-perspective]');if(perspective){st.batch.perspective=perspective.dataset.batchPerspective;st.batchPerspective=st.batch.perspective;draw();return;}
 if(e.target.closest('[data-batch-back]')){st.v='V26';st.h=[];draw();return;}
 const replay=e.target.closest('[data-batch-replay]');if(replay){const ev=batchEvent(st.batch.selected);st.replayCourse=ev.category;st.t=ev.replaySec||0;st.h.push(st.v);st.v='V03';draw();return;}
});

 return c==='WVR'?'WVR':c==='BVR'?'BVR':c==='STRIKE'?'STRIKE':null;

function batchSetCurrentEvent(eventId){
 const e=batchEvent(eventId);
 st.batch.selected=e.id;
 st.batch.perspective=batchPerspectiveDefault(e);
 st.batchPerspective=st.batch.perspective;
 st.replayCourse=e.category;
 st.t=e.replaySec||0;
 const rail=SORTIE_EVENTS[st.v]||[];
 if(rail.length){
  let best=0,delta=Infinity;
  rail.forEach((x,i)=>{const d=Math.abs((x.t||0)-(e.replaySec||0));if(d<delta){delta=d;best=i;}});

 }

/* ===== V22：批次筛选行重排 + 红蓝关系配置 ===== */
const BATCH_RELATION_DEFAULTS = (()=>{
 const m=new Map();
 const add=(key,label,group,side,detail='')=>{
  if(!key||!label)return;
  if(!m.has(key))m.set(key,{key,label,group,side:side||'UNASSIGNED',detail});
  else if(m.get(key).side!==side)m.get(key).conflict=true;
 };
 BATCH_WEAPON_EVENTS.forEach(e=>{
  add('AIR:'+e.shooterAircraft,e.shooterAircraft,'aircraft',e.shooterSide,'射手/目标飞机');
  if(e.targetAircraft&&e.targetAircraft!=='地面目标')add('AIR:'+e.targetAircraft,e.targetAircraft,'aircraft',e.targetSide,'射手/目标飞机');
  add('FORMATION:'+e.shooterFormation,e.shooterFormation,'formation',e.shooterSide,'想定编成');
  add('FORMATION:'+e.targetFormation,e.targetFormation,'formation',e.targetSide,'想定编成');
  if(e.targetAircraft==='地面目标'||/^地面目标/.test(e.target||''))add('TARGET:'+e.target,e.target,'ground',e.targetSide,e.targetFormation||'地面目标');
 });
 return [...m.values()];
})();
const BATCH_RELATION_DEFAULT_MAP=Object.fromEntries(BATCH_RELATION_DEFAULTS.map(x=>[x.key,x.side]));
const BATCH_RELATION_STORAGE_KEY='tpaa-v22-batch-relations:'+st.batch.id;
st.batchRelations=st.batchRelations||{...BATCH_RELATION_DEFAULT_MAP};
try{
 const saved=JSON.parse(localStorage.getItem(BATCH_RELATION_STORAGE_KEY)||'null');
 if(saved&&typeof saved==='object')st.batchRelations={...BATCH_RELATION_DEFAULT_MAP,...saved};
}catch(_e){}
let batchRelationDraft=null;
function batchSideOf(e,endpoint){
 const shooter=endpoint==='shooter';
 const aircraft=shooter?e.shooterAircraft:e.targetAircraft;
 const formation=shooter?e.shooterFormation:e.targetFormation;
 const target=shooter?null:e.target;
 const keys=[];
 if(aircraft&&aircraft!=='地面目标')keys.push('AIR:'+aircraft);
 if(!shooter&&target)keys.push('TARGET:'+target);
 if(formation)keys.push('FORMATION:'+formation);
 for(const key of keys){if(Object.prototype.hasOwnProperty.call(st.batchRelations,key))return st.batchRelations[key];}
 return shooter?e.shooterSide:e.targetSide;
}
function batchRole(e){
 const ss=batchSideOf(e,'shooter'),ts=batchSideOf(e,'target'),side=st.batch.side;
 if(ss===side)return '我方发射';
 if(ts===side&&ss!==side)return '对方来袭';
 return '非本方事件';
}
function batchPerspectiveDefault(e){
 if(batchSideOf(e,'shooter')===st.batch.side)return 'shooter';
 if(batchSideOf(e,'target')===st.batch.side)return 'target';
 return 'shooter';
}
function batchFilteredEvents(){
 const f=st.batch;
 return BATCH_WEAPON_EVENTS.filter(e=>{
  const ss=batchSideOf(e,'shooter'),ts=batchSideOf(e,'target');
  const own=ss===f.side,incoming=ts===f.side&&ss!==f.side;
  const direction=f.role==='OUT'?own:f.role==='IN'?incoming:(own||incoming);
  return direction&&
   (f.category==='ALL'||e.category===f.category)&&
   (f.aircraft==='ALL'||[e.shooterAircraft,e.targetAircraft,e.shooter,e.target].includes(f.aircraft))&&
   (f.sortie==='ALL'||[e.shooterSortie,e.targetSortie].includes(f.sortie))&&
   (f.formation==='ALL'||[e.shooterFormation,e.targetFormation].includes(f.formation))&&
   (f.status==='ALL'||(f.status==='ADJ'&&e.status==='已裁决')||(f.status==='PENDING'&&e.status!=='已裁决'));
 });
}
function batchEventsForCategory(cat){
 const f=st.batch;
 return BATCH_WEAPON_EVENTS.filter(e=>{
  if(e.category!==cat)return false;
  const ss=batchSideOf(e,'shooter'),ts=batchSideOf(e,'target');
  const own=ss===f.side,incoming=ts===f.side&&ss!==f.side;
  return f.role==='OUT'?own:f.role==='IN'?incoming:(own||incoming);
 });
}

 };

  if(!name)return;
  if(!targets.has(name))targets.set(name,new Set());
  if(side)targets.get(name).add(side);
 };
 BATCH_WEAPON_EVENTS.forEach(e=>{
  if(e.shooterAircraft&&e.shooterAircraft!=='地面目标'){
   aircraft.add(e.shooterAircraft);addFormation(e.shooterFormation,e.shooterSide);addMember(e.shooterFormation,e.shooterAircraft);
  }
  if(e.targetAircraft&&e.targetAircraft!=='地面目标'){
   aircraft.add(e.targetAircraft);addFormation(e.targetFormation,e.targetSide);addMember(e.targetFormation,e.targetAircraft);

 });

 for(const [name,sides] of formations.entries())formationRows[name]={side:sides.size===1?[...sides][0]:'UNASSIGNED',aircraft:[]};
 const membershipConflicts=[];
 for(const ac of aircraft){
  const candidates=[...(members.get(ac)||[])];
  if(candidates.length===1&&formationRows[candidates[0]])formationRows[candidates[0]].aircraft.push(ac);
  else if(candidates.length>1)membershipConflicts.push({aircraft:ac,formations:candidates});
 }
 const targetRows={};
 for(const [name,sides] of targets.entries())targetRows[name]=sides.size===1?[...sides][0]:'UNASSIGNED';

<script>
/* TPAA V28 patch: replace V01 with a batch-level training situation overview.
 * Scope: V01 only. Existing V04-V21, V26, Ribbon, themes and other page bodies are preserved.
 */
(function(){
  'use strict';
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SCOPE = { 'WE-001':'single','WE-002':'single','WE-003':'team','WE-004':'single','WE-005':'team','WE-006':'single','WE-007':'team','WE-008':'team','WE-009':'single','WE-010':'single','WE-011':'team','WE-012':'single' };
  const CAT = {
    WVR:{label:'视距内行为',short:'WVR',color:'#e0701a',single:'V05',team:'V20'},
    BVR:{label:'超视距行为',short:'BVR',color:'#d6a64c',single:'V04',team:'V08'},
    STRIKE:{label:'对地攻击',short:'Strike',color:'#bd79a8',single:'V06',team:'V21'}
  };
  st.v01Filters = st.v01Filters || {side:'BOTH',formation:'ALL',range:'ALL'};
  function parseMinute(s){
    if(!s)return null;const m=String(s).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);if(!m)return null;
    return Number(m[1])*60+Number(m[2])+(Number(m[3]||0)/60);
  }
  function episodeWindow(e){
    const w=e.eventWindow||{};
    const starts=[w.shooterStart,w.targetStart,w.launch].map(parseMinute).filter(Number.isFinite);
    const ends=[w.resultEnd,w.dataCoverageEnd,w.terminal,w.launch].map(parseMinute).filter(Number.isFinite);
    return {start:starts.length?Math.min(...starts):parseMinute(e.time),end:ends.length?Math.max(...ends):parseMinute(e.time)};
  }
  function eventFormations(e){
    const sf=typeof batchV23FormationForEvent==='function'?batchV23FormationForEvent(e,'shooter'):e.shooterFormation;
    const tf=(e.targetAircraft&&e.targetAircraft!=='地面目标'&&typeof batchV23FormationForEvent==='function')?batchV23FormationForEvent(e,'target'):(e.targetFormation||'');
    return [sf,tf].filter(Boolean);
  }
  function sideOf(e,endpoint){
    if(typeof batchSideOf==='function')return batchSideOf(e,endpoint);
    return endpoint==='shooter'?e.shooterSide:e.targetSide;
  }
  function filteredEvents(){
    const f=st.v01Filters;
    return BATCH_WEAPON_EVENTS.filter(e=>{
      if(f.side!=='BOTH'&&sideOf(e,'shooter')!==f.side&&sideOf(e,'target')!==f.side)return false;
      if(f.formation!=='ALL'&&!eventFormations(e).includes(f.formation))return false;
      const t=parseMinute(e.time)||0;
      if(f.range==='R1'&&(t<9*60||t>=9*60+30))return false;
      if(f.range==='R2'&&(t<9*60+30||t>=10*60))return false;
      if(f.range==='R3'&&(t<10*60||t>10*60+30))return false;
      return true;
    }).sort((a,b)=>(parseMinute(a.time)||0)-(parseMinute(b.time)||0));
  }
  function episodeGroups(events){
    const map=new Map();
    events.forEach(e=>{
      const id=e.eventWindow?.episodeId||'EP-待关联';
      if(!map.has(id))map.set(id,[]);map.get(id).push(e);
    });
    return [...map.entries()].map(([id,rows])=>{
      const ws=rows.map(episodeWindow),starts=ws.map(x=>x.start).filter(Number.isFinite),ends=ws.map(x=>x.end).filter(Number.isFinite);
      const cats=[...new Set(rows.map(x=>x.category))];
      return {id,rows,start:starts.length?Math.min(...starts):null,end:ends.length?Math.max(...ends):null,category:cats.length===1?cats[0]:'MIXED'};
    }).sort((a,b)=>(a.start||0)-(b.start||0));
  }
  function scopeOf(e){return SCOPE[e.id]||'unclassified';}
  function categoryMatrix(events){
    return ['WVR','BVR','STRIKE'].map(k=>{
      const rows=events.filter(e=>e.category===k);
      return {key:k,rows,single:rows.filter(e=>scopeOf(e)==='single').length,team:rows.filter(e=>scopeOf(e)==='team').length,unknown:rows.filter(e=>scopeOf(e)==='unclassified').length};
    });
  }
  function countUnique(values){return new Set(values.filter(Boolean)).size;}
  function kpis(events){
    const aircraft=events.flatMap(e=>[e.shooterAircraft,e.targetAircraft]).filter(x=>x&&x!=='地面目标');
    const knownForms=new Set(Object.keys(st.batchRelations?.formations||{}));
    const forms=events.flatMap(eventFormations).filter(x=>knownForms.has(x));
    const sorties=events.flatMap(e=>[e.shooterSortie,e.targetSortie]).filter(x=>x&&!String(x).startsWith('场景目标'));
    const episodes=events.map(e=>e.eventWindow?.episodeId).filter(Boolean);
    const pending=events.filter(e=>e.status!=='已裁决').length;
    return [
      ['参演飞机',countUnique(aircraft),'按当前筛选范围去重'],
      ['参演编队',countUnique(forms),'按事件关联编队去重'],
      ['关联架次标识',countUnique(sorties),'不将场景目标编号计为架次'],
      ['交战过程 EP',countUnique(episodes),'由已关联 Episode 汇总'],
      ['武器发射 WE',events.length,'每枚武器独立计数'],
      ['待正式裁决',pending,'不等同于武器未终止']
    ];
  }
  function stageBand(){

  function episodeTimeline(events){

  HISTORY.forEach(b=>{b.kind=TRAINING_TYPE_BY_ID[b.id]||b.kind;b.taskMetrics=TASK_METRICS_BY_ID[b.id]||null;});
  function liveRecord(){
    const rows=typeof BATCH_WEAPON_EVENTS!=='undefined'?BATCH_WEAPON_EVENTS:[];
    const cats={WVR:0,BVR:0,STRIKE:0};
    rows.forEach(e=>{if(e.category in cats)cats[e.category]++;});
    const adjud=rows.filter(e=>e.status==='已裁决').length;
    const ep=typeof BATCH_NO_LAUNCH!=='undefined'?0:0;
    return {cats,we:rows.length,adjud,episodes:ep,results:{hit:rows.filter(e=>/命中/.test(e.result||'')&&!/未命中/.test(e.result||'')).length,miss:rows.filter(e=>/未命中/.test(e.result||'')).length,evade:rows.filter(e=>/规避成功/.test(e.result||'')).length,pending:rows.filter(e=>e.status!=='已裁决').length},sorties:new Set(rows.flatMap(e=>[e.shooterSortie,e.targetSortie]).filter(x=>x&&!String(x).startsWith('场景目标'))).size};
  }
  function allocateByCategory(total,cats){
    const keys=['WVR','BVR','STRIKE'],sum=keys.reduce((a,k)=>a+(cats[k]||0),0);
    if(!sum)return {WVR:0,BVR:0,STRIKE:0};
    const out={},remainders=[];let used=0;
    keys.forEach(k=>{const exact=total*(cats[k]||0)/sum,base=Math.floor(exact);out[k]=base;used+=base;remainders.push({k,r:exact-base});});
    remainders.sort((a,b)=>b.r-a.r);for(let i=0;i<total-used;i++)out[remainders[i%remainders.length].k]++;
    return out;
  }
  HISTORY.filter(x=>!x.live).forEach(b=>{
    b.resultsByCat={WVR:{},BVR:{},STRIKE:{}};
    ['hit','miss','evade','pending'].forEach(k=>{
      const split=allocateByCategory(b.results[k],b.cats);
      ['WVR','BVR','STRIKE'].forEach(cat=>b.resultsByCat[cat][k]=split[cat]);
    });
    b.episodesByCat=allocateByCategory(b.episodes,b.cats);
  });
  const live=liveRecord();
  const liveRow=HISTORY.find(x=>x.live);
  liveRow.cats=live.cats;liveRow.we=live.we;liveRow.adjud=live.adjud;liveRow.episodes=typeof BATCH_WEAPON_EVENTS!=='undefined'?new Set(BATCH_WEAPON_EVENTS.map(e=>e.eventWindow?.episodeId).filter(Boolean)).size:0;
  liveRow.sorties=live.sorties;liveRow.results=live.results;liveRow.resultsByCat={};
  ['WVR','BVR','STRIKE'].forEach(cat=>{
    const rs=BATCH_WEAPON_EVENTS.filter(e=>e.category===cat);
    liveRow.resultsByCat[cat]={
      hit:rs.filter(e=>/命中/.test(e.result||'')&&!/未命中/.test(e.result||'')).length,
      miss:rs.filter(e=>/未命中/.test(e.result||'')).length,
      evade:rs.filter(e=>/规避成功/.test(e.result||'')).length,
      pending:rs.filter(e=>e.status!=='已裁决').length
    };
  });
  liveRow.episodesByCat=allocateByCategory(liveRow.episodes,liveRow.cats);
  liveRow.blue=BATCH_WEAPON_EVENTS.filter(e=>e.shooterSide==='BLUE').length;liveRow.red=BATCH_WEAPON_EVENTS.filter(e=>e.shooterSide==='RED').length;
  st.v29Filters=Object.assign({startDate:'2025-11-05',endDate:'2026-11-05',model:'ALL',trainingType:'ALL',equip:'turn'},st.v29Filters||{});
  delete st.v29Filters.range;delete st.v29Filters.category;
  st.v29SelectedBatch=st.v29SelectedBatch||LIVE_BATCH_ID;
  function filteredHistory(){
    const f=st.v29Filters;
    const start=f.startDate||'0001-01-01',end=f.endDate||'9999-12-31';
    if(start>end)return [];
    return HISTORY.filter(b=>{
      if(b.date<start||b.date>end)return false;
      if(f.model==='A型'&&b.shareA<=0)return false;
      if(f.model==='B型'&&b.shareA>=1)return false;
      if(f.trainingType!=='ALL'&&b.kind!==f.trainingType)return false;
      return true;
    });
  }
  function categoryTotal(b){return Object.values(b.cats||{}).reduce((a,v)=>a+v,0);}
  function modelFactor(b){return st.v29Filters.model==='A型'?b.shareA:st.v29Filters.model==='B型'?1-b.shareA:1;}
  function nval(v){return Math.round(v);}
  function sums(rows,fn){return rows.reduce((a,b)=>a+fn(b),0);}
  function kpiMarkup(rows){
    const we=sums(rows,b=>categoryTotal(b)*modelFactor(b));
    const ep=sums(rows,b=>b.episodes*modelFactor(b));
    const adj=sums(rows,b=>((b.results?.hit||0)+(b.results?.miss||0)+(b.results?.evade||0))*modelFactor(b));
    const sorties=sums(rows,b=>b.sorties*modelFactor(b));
    const qualified=rows.filter(b=>b.dataPass>=Math.max(1,b.formations*2)).length;
    const vals=[
      ['历史训练批次',rows.length,'按日期、机型和训练类型筛选'],
      ['飞行架次',nval(sorties),'跨批次累计，不按人员评分'],
      ['交战过程',nval(ep),'跨批次训练过程统计'],
      ['武器发射',nval(we),'按每枚武器独立统计'],
      ['已正式裁决',nval(adj),'仅统计已形成正式裁决的记录'],
      ['数据资格通过批次',qualified,'以批次数据资格摘要为准']
    ];
    return vals.map(x=>`<div class="v29Kpi"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('');
  }
  function svgLine(rows,series,{min=0,max=null,unit='',height=130}={}){
    const W=690,H=height,L=42,R=14,T=10,B=24,iw=W-L-R,ih=H-T-B;
    const vals=series.flatMap(z=>rows.map(r=>z.value(r))).filter(Number.isFinite);
    if(max==null)max=Math.max(1,...vals)*1.12;
    const x=i=>L+(rows.length<=1?0:i/(rows.length-1)*iw);
    const y=v=>T+ih-(v-min)/(max-min||1)*ih;
    const ticks=4;
    let grid='';
    for(let i=0;i<=ticks;i++){const v=min+(max-min)*i/ticks,yy=y(v);grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--ln)" stroke-width="1"/><text x="${L-7}" y="${yy+3}" text-anchor="end" fill="var(--mu)" font-size="9">${Number(v.toFixed(1))}</text>`;}
    const lines=series.map(z=>{
      const pts=rows.map((r,i)=>`${x(i)},${y(z.value(r))}`).join(' ');
      const dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(z.value(r))}" r="3" fill="${z.color}"><title>${r.date} ${z.name}: ${z.value(r)} ${unit}</title></circle>`).join('');
      return `<polyline points="${pts}" fill="none" stroke="${z.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
    }).join('');
    const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle" fill="var(--mu)" font-size="8">${r.date.slice(5,10).replace('-', '/')}</text>`).join('');
    const legend=series.map(z=>`<span class="v29Legend"><i style="background:${z.color}"></i>${z.name}</span>`).join('');
    return `<div class="v29ChartLegend">${legend}</div><svg class="v29Svg" viewBox="0 0 ${W} ${H}" role="img">${grid}${lines}${labels}</svg>`;
  }
  function stackedBars(rows,keys,height=130){
    const W=690,H=height,L=38,R=12,T=8,B=24,iw=W-L-R,ih=H-T-B;
    const max=Math.max(1,...rows.map(r=>keys.reduce((a,k)=>a+(r[k.key]||0),0)))*1.15;
    const bw=Math.min(28,iw/Math.max(1,rows.length)*.56),gap=iw/Math.max(1,rows.length);
    let grid='';
    for(let i=0;i<=4;i++){const v=max*i/4,yy=T+ih-v/max*ih;grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--ln)"/><text x="${L-6}" y="${yy+3}" text-anchor="end" fill="var(--mu)" font-size="8">${Math.round(v)}</text>`;}
    const bars=rows.map((r,i)=>{let y0=T+ih;return keys.map(k=>{const v=r[k.key]||0,h=v/max*ih;y0-=h;return `<rect x="${L+gap*i+(gap-bw)/2}" y="${y0}" width="${bw}" height="${Math.max(0,h)}" fill="${k.color}" rx="1"><title>${r.date} ${k.name}: ${v}</title></rect>`;}).join('')+`<text x="${L+gap*i+gap/2}" y="${H-7}" text-anchor="middle" fill="var(--mu)" font-size="8">${r.date.slice(5,10).replace('-', '/')}</text>`;}).join('');
    return `<div class="v29ChartLegend">${keys.map(k=>`<span class="v29Legend"><i style="background:${k.color}"></i>${k.name}</span>`).join('')}</div><svg class="v29Svg" viewBox="0 0 ${W} ${H}" role="img">${grid}${bars}</svg>`;
  }
  function equipmentRows(rows){
    if(!rows.length)return '<div class="v29Empty">当前日期范围内没有符合条件的历史批次。</div>';
    const key=st.v29Filters.equip,model=st.v29Filters.model;
    const seriesAll=key==='turn'?[{name:'A 型',color:'#55a9e5',value:r=>r.turnA},{name:'B 型',color:'#df8b57',value:r=>r.turnB}]:
      key==='r50'?[{name:'A 型',color:'#55a9e5',value:r=>r.r50A},{name:'B 型',color:'#df8b57',value:r=>r.r50B}]:
      [{name:'A 型',color:'#55a9e5',value:r=>r.respA},{name:'B 型',color:'#df8b57',value:r=>r.respB}];
    const series=model==='ALL'?seriesAll:seriesAll.filter(z=>z.name===(model==='A型'?'A 型':'B 型'));
    const vals=series.flatMap(z=>rows.map(z.value));
    const min=Math.floor(Math.min(...vals)*.9*10)/10,max=Math.ceil(Math.max(...vals)*1.1*10)/10;

  function categoryTrend(rows){
    const flat=rows.map(b=>({...b,WVR:(b.cats.WVR||0)*modelFactor(b),BVR:(b.cats.BVR||0)*modelFactor(b),STRIKE:(b.cats.STRIKE||0)*modelFactor(b)}));

  }
  function outcomeTrend(rows){
    const flat=rows.map(b=>({...b,hit:(b.results?.hit||0)*modelFactor(b),miss:(b.results?.miss||0)*modelFactor(b),evade:(b.results?.evade||0)*modelFactor(b),pending:(b.results?.pending||0)*modelFactor(b)}));

      {key:'hit',name:'命中/任务达成',color:'#49a889'},
      {key:'miss',name:'未命中/未达成',color:'#d17a70'},
      {key:'evade',name:'目标规避成功',color:'#d5ad55'},
      {key:'pending',name:'待正式裁决',color:'#788da6'}
    ],125);
  }
  function taskMetricsTrend(rows){
    const data=rows.filter(b=>b.taskMetrics).sort((a,b)=>a.date.localeCompare(b.date));
    if(!data.length)return '<div class="v29Empty">当前日期范围内暂无已形成任务级指标的批次。</div>';

    const x=i=>L+(data.length<=1?0:i/(data.length-1)*iw);
    const yRatio=v=>T+ih-(v/2.5)*ih;
    const yPct=v=>T+ih-(v/100)*ih;
    let grid='';
    for(let i=0;i<=5;i++){
      const ratio=i*.5,yy=yRatio(ratio),pct=i*20;
      grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--ln)"/><text x="${L-7}" y="${yy+3}" text-anchor="end" fill="var(--mu)" font-size="8">${ratio.toFixed(1)}</text><text x="${W-R+7}" y="${yy+3}" text-anchor="start" fill="var(--mu)" font-size="8">${pct}%</text>`;
    }
    const series=[
      {key:'killRatio',name:'击杀比',color:'#55a9e5',axis:'ratio',unit:'比'},
      {key:'exchangeRatio',name:'敌我交换比',color:'#d5ad55',axis:'ratio',unit:'比'},
      {key:'missionRate',name:'任务达成率',color:'#49a889',axis:'pct',unit:'%'}
    ];
    const paths=series.map(z=>{
      const pts=data.map((b,i)=>`${x(i)},${(z.axis==='pct'?yPct(b.taskMetrics[z.key]):yRatio(b.taskMetrics[z.key]))}`).join(' ');
      const dots=data.map((b,i)=>{const val=b.taskMetrics[z.key],yy=z.axis==='pct'?yPct(val):yRatio(val);return `<circle cx="${x(i)}" cy="${yy}" r="2.8" fill="${z.color}"><title>${b.date} · ${b.kind} · ${z.name}：${z.axis==='pct'?val+'%':val.toFixed(2)+'比'}</title></circle>`;}).join('');
      return `<polyline points="${pts}" fill="none" stroke="${z.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
    }).join('');
    const labels=data.map((b,i)=>`<text x="${x(i)}" y="${H-4}" text-anchor="middle" fill="var(--mu)" font-size="8">${b.date.slice(5,10).replace('-', '/')}</text>`).join('');
    const legend=series.map(z=>`<span class="v29Legend"><i style="background:${z.color}"></i>${z.name}</span>`).join('');
    return `<div class="v29ChartLegend">${legend}<span class="v29AxisNote">左轴：比值　右轴：百分比</span></div><svg class="v29TaskSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="任务级指标趋势曲线">${grid}${paths}${labels}</svg>`;
  }
  function batchRows(rows){
    return [...rows].sort((a,b)=>b.date.localeCompare(a.date)).map(b=>{
      const active=st.v29SelectedBatch===b.id;
      const we=nval(categoryTotal(b)*modelFactor(b));

  function selectedBatchMarkup(rows){
