[project]
name = "tpaa"
version = "0.0.0"
description = "TPAA airborne-data assessment system engineering bootstrap"
requires-python = ">=3.13,<3.14"
license = "Proprietary"
dependencies = []

[tool.uv]
required-version = ">=0.10,<0.13"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["baseline"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
files = ["tools", "src", "tests"]
exclude = ["^baseline/"]

[tool.tpaa.dataframe]
preferred-engine = "polars"
pandas-default-dependency = false
policy-document = "docs/developer/DATAFRAME_POLICY.md"
