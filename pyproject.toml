[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tpaa"
version = "1.0.0"
description = "TPAA production airborne-data assessment and qualification system"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
dependencies = [
    "cryptography==49.0.0",
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "polars==1.44.2",
    "psycopg[binary]==3.3.6",
    "pyside6==6.11.2",
]

[project.optional-dependencies]
service-s3 = ["boto3==1.43.112"]

[project.scripts]
tpaa-admin = "tpaa_admin.__main__:main"
tpaa-service = "tpaa_service.__main__:main"

[project.gui-scripts]
tpaa-desktop = "tpaa_desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tpaa*"]

[tool.setuptools.package-data]
tpaa_security = ["TPAA_SECURITY_POLICY_V1.json"]

[tool.uv]
required-version = ">=0.10,<0.13"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = [".", "src"]
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["baseline"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = ["src", "."]
files = ["tools", "src"]
exclude = ["^baseline/"]

[tool.tpaa.dataframe]
preferred-engine = "polars"
pandas-default-dependency = false
policy-document = "docs/developer/DATAFRAME_POLICY.md"
