name: V33 F0 Gate

on:
  pull_request:
  push:
    branches:
      - codex/v33-f0-f9-implementation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f0-platform-gate:
    name: F0 complete gate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
    env:
      POLARS_SKIP_CPU_CHECK: "1"
      QT_QPA_PLATFORM: "offscreen"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --no-install-recommends -y
          fonts-dejavu-core libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 libxkbcommon0

      - name: Synchronize frozen project dependencies
        run: uv sync --locked --extra service-s3 --python 3.13.5

      - name: Ruff
        run: uv run --frozen --with ruff==0.16.8 ruff check src tests tools migrations

      - name: Typecheck
        run: uv run --frozen python tools/dev/tpaa_dev.py typecheck

      - name: F0 historical baseline verification
        run: >-
          uv run --frozen python tools/baseline/verify_f0_byte_stability.py
          --evidence evidence/f0/${{ matrix.platform }}.json

      - name: G12 successor reconstruction
        run: uv run --frozen python tools/baseline/adopt_g12_successor.py --check

      - name: Demo-function successor scaffold
        run: uv run --frozen python tools/baseline/adopt_demo_function_successor.py --check

      - name: Task-metric codegen scaffold
        run: uv run --frozen python tools/codegen/task_metric_generate.py --check

      - name: F0 targeted contracts
        run: >-
          uv run --frozen --with pytest==9.0.2 python -m pytest -p no:cacheprovider
          tests/unit/test_f0_byte_stability.py
          tests/unit/test_m0_core_002_canonical_loader.py
          tests/contract/test_m0_core_001_baseline_verify.py
          tests/contract/gui_v33/test_g12_v33_design_freeze_contract.py
          -q

      - name: Required Python regression gates
        run: >-
          uv run --frozen --with pytest==9.0.2 python -m pytest -p no:cacheprovider
          tests/contract/gui_v33
          tests/unit/application
          tests/unit/api
          tests/unit/runtime
          tests/unit/storage
          tests/unit/gui
          -q

      - name: Frontend npm ci
        working-directory: frontend/gui-v33
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend/gui-v33
        run: npm run typecheck

      - name: Frontend gateway tests
        working-directory: frontend/gui-v33
        run: npm run test:gateway

      - name: Frontend build
        working-directory: frontend/gui-v33
        run: npm run build

      - name: G1 frontend build
        run: uv run --frozen python tools/gui/g1_frontend_build.py

      - name: Upload F0 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-v33-f0-${{ matrix.platform }}-${{ github.sha }}
          path: evidence/f0/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
