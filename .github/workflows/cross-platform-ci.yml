name: Cross-platform CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-cross-platform:
    name: M0 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            desktop_profile: LINUX_DESKTOP_X64
            service_profile: LINUX_SERVICE_X64
          - platform: windows
            runner: windows-2025
            desktop_profile: WINDOWS_DESKTOP_X64
            service_profile: WINDOWS_SERVICE_X64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install Linux Qt runtime dependency
        if: ${{ matrix.platform == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1

      - name: Synchronize frozen project dependencies
        run: uv sync --locked --python 3.13.5

      - name: Verify dependency lock
        run: uv lock --check

      - name: Verify CI orchestration contract
        run: uv run --locked python tools/dev/tpaa_dev.py verify-ci

      - name: Run governed M0 cross-platform gates
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py ci-check
          --expected-platform ${{ matrix.platform }}
          --evidence evidence/ci/${{ matrix.platform }}.json

      - name: Emit M0 build evidence
        run: |
          uv run --locked python tools/dev/tpaa_dev.py manifest --profile ${{ matrix.desktop_profile }} --output evidence/devops/${{ matrix.platform }}/desktop
          uv run --locked python tools/dev/tpaa_dev.py manifest --profile ${{ matrix.service_profile }} --output evidence/devops/${{ matrix.platform }}/service

      - name: Verify M1 Entry preparation contracts
        run: uv run --locked python tools/dev/tpaa_dev.py verify-m1-entry-preparation

      - name: Verify M1 Entry Gate review state
        run: uv run --locked python tools/dev/tpaa_dev.py verify-m1-entry-gate-state

      - name: Verify M1 detailed-design runway
        run: uv run --locked python tools/dev/tpaa_dev.py verify-m1-detailed-design

      - name: Emit M1-TST-001 fixture evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-fixture-check
          --evidence evidence/m1-fixtures/${{ matrix.platform }}/fixture-evidence.json

      - name: Emit M1-DATA-001 source-adapter evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-source-adapter-check
          --evidence evidence/m1-data-001/${{ matrix.platform }}/source-adapter.json

      - name: Emit M1-DATA-002 source-registry evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-source-registry-check
          --evidence evidence/m1-data-002/${{ matrix.platform }}/source-registry.json

      - name: Emit M1-DATA-003 Session Time evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-session-time-check
          --evidence evidence/m1-data-003/${{ matrix.platform }}/session-time.json

      - name: Emit M1-DATA-004 aircraft-identity evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-aircraft-identity-check
          --evidence evidence/m1-data-004/${{ matrix.platform }}/aircraft-identity.json

      - name: Emit M1-DATA-005 Canonical-flight-channel evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-canonical-flight-channels-check
          --evidence evidence/m1-data-005/${{ matrix.platform }}/canonical-flight-channels.json

      - name: Emit M1-DATA-006 Evaluation Context evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-evaluation-context-check
          --evidence evidence/m1-data-006/${{ matrix.platform }}/evaluation-context.json

      - name: Emit M1-DATA-007 lineage-quality evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-lineage-quality-check
          --evidence evidence/m1-data-007/${{ matrix.platform }}/lineage-quality.json

      - name: Emit M1-WORLD-001 Basic Episode evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-basic-episode-check
          --evidence evidence/m1-world-001/${{ matrix.platform }}/basic-episode.json

      - name: Emit M1-WORLD-002 BASIC_FLIGHT_V1 Stage evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-basic-stage-check
          --evidence evidence/m1-world-002/${{ matrix.platform }}/basic-stage.json

      - name: Emit M1-WORLD-003 Stage quality/status evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-stage-quality-check
          --evidence evidence/m1-world-003/${{ matrix.platform }}/stage-quality.json

      - name: Emit consolidated M1 Batch 1 core evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-1-core-check
          --evidence evidence/m1-batch-1/${{ matrix.platform }}/core-product.json

      - name: Emit M1 Batch 2 service smoke evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-2-service-smoke
          --expected-platform ${{ matrix.platform }}
          --source-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence evidence/m1-batch-2/${{ matrix.platform }}/service-smoke.json

      - name: Emit consolidated M1 Batch 2 backend evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-2-backend-check
          --platform ${{ matrix.platform }}
          --source-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence evidence/m1-batch-2/${{ matrix.platform }}/backend.json

      - name: Emit M1 Entry build-manifest candidate
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-entry-manifest
          --profile ${{ matrix.desktop_profile }}
          --output evidence/m1-entry/${{ matrix.platform }}/build-manifest.json

      - name: Build M0 development packages
        run: |
          uv run --locked python tools/dev/tpaa_dev.py package --profile ${{ matrix.desktop_profile }} --output dist
          uv run --locked python tools/dev/tpaa_dev.py package --profile ${{ matrix.service_profile }} --output dist

      - name: Emit M0 fixture framework evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py fixture-check
          --evidence evidence/tests/framework-${{ matrix.platform }}.json

      - name: Emit platform logical product
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py platform-logical-product
          --output evidence/cross-platform/${{ matrix.platform }}.json

      - name: Upload M0 CI, Step 9 and Step 10 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-ci-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/ci/${{ matrix.platform }}.json
            evidence/tests/framework-${{ matrix.platform }}.json
            evidence/cross-platform/${{ matrix.platform }}.json
            evidence/devops/${{ matrix.platform }}
            evidence/m1-entry/${{ matrix.platform }}/build-manifest.json
            evidence/m1-fixtures/${{ matrix.platform }}/fixture-evidence.json
            evidence/m1-data-001/${{ matrix.platform }}/source-adapter.json
            evidence/m1-data-002/${{ matrix.platform }}/source-registry.json
            evidence/m1-data-003/${{ matrix.platform }}/session-time.json
            evidence/m1-data-004/${{ matrix.platform }}/aircraft-identity.json
            evidence/m1-data-005/${{ matrix.platform }}/canonical-flight-channels.json
            evidence/m1-data-006/${{ matrix.platform }}/evaluation-context.json
            evidence/m1-data-007/${{ matrix.platform }}/lineage-quality.json
            evidence/m1-world-001/${{ matrix.platform }}/basic-episode.json
            evidence/m1-world-002/${{ matrix.platform }}/basic-stage.json
            evidence/m1-world-003/${{ matrix.platform }}/stage-quality.json
            evidence/m1-batch-1/${{ matrix.platform }}/core-product.json
            evidence/m1-batch-2/${{ matrix.platform }}/service-smoke.json
            evidence/m1-batch-2/${{ matrix.platform }}/backend.json
            dist/
          if-no-files-found: error
          retention-days: 14

  m0-logical-equivalence:
    name: M0 logical equivalence
    needs: m0-cross-platform
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Download platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tpaa-ci-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Compare Windows and Linux logical products
        run: >-
          python tools/dev/tpaa_dev.py compare-platform-logical
          --windows downloaded/evidence/cross-platform/windows.json
          --linux downloaded/evidence/cross-platform/linux.json
          --evidence evidence/cross-platform/logical-equivalence.json

      - name: Compare Windows and Linux M1 Batch 1 products
        run: >-
          python tools/dev/tpaa_dev.py m1-batch-1-compare
          --windows downloaded/evidence/m1-batch-1/windows/core-product.json
          --linux downloaded/evidence/m1-batch-1/linux/core-product.json
          --evidence evidence/cross-platform/m1-batch-1-logical-equivalence.json

      - name: Compare Windows and Linux M1 Batch 2 service products
        run: >-
          python tools/dev/tpaa_dev.py m1-batch-2-service-compare
          --windows downloaded/evidence/m1-batch-2/windows/service-smoke.json
          --linux downloaded/evidence/m1-batch-2/linux/service-smoke.json
          --evidence evidence/cross-platform/m1-batch-2-service-logical-equivalence.json

      - name: Upload logical-equivalence evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-logical-equivalence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/cross-platform/logical-equivalence.json
            evidence/cross-platform/m1-batch-1-logical-equivalence.json
            evidence/cross-platform/m1-batch-2-service-logical-equivalence.json
          if-no-files-found: error
          retention-days: 14


  m0-exit-postgres:
    name: M0 Exit PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tpaa
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpaa -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client libegl1

      - name: Synchronize frozen project dependencies
        run: uv sync --locked --python 3.13.5

      - name: Verify dependency lock
        run: uv lock --check

      - name: Run PostgreSQL clean-bootstrap Exit acceptance
        run: |
          mkdir -p evidence/m0-exit
          uv run --locked python tools/dev/tpaa_dev.py db-postgres-acceptance \
            --user tpaa --host 127.0.0.1 --port 5432 \
            --admin-database postgres --database tpaa_m0_sto_001_exit_acceptance \
            > evidence/m0-exit/postgres-bootstrap.json

      - name: Run PostgreSQL Repository Exit acceptance
        run: |
          uv run --locked python tools/dev/tpaa_dev.py db-postgres-repository-acceptance \
            --user tpaa --host 127.0.0.1 --port 5432 \
            --admin-database postgres --database tpaa_m0_sto_003_exit_acceptance \
            --conninfo-template "host=127.0.0.1 port=5432 user=tpaa dbname={database}" \
            > evidence/m0-exit/postgres-repository.json

      - name: Emit M1 Batch 2 SQLite PostgreSQL parity evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-2-storage-parity
          --user tpaa
          --host 127.0.0.1
          --port 5432
          --admin-database postgres
          --database tpaa_m1_batch_2_parity
          --conninfo-template "host=127.0.0.1 port=5432 user=tpaa dbname={database}"
          --source-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence evidence/m1-batch-2/postgres/storage-parity.json

      - name: Cold-start full M0 with live PostgreSQL
        run: >-
          uv run --locked python tools/ci/cold_start.py
          --expected-platform linux
          --postgres-user tpaa
          --postgres-host 127.0.0.1
          --postgres-port 5432
          --postgres-admin-database postgres
          --postgres-conninfo-template "host=127.0.0.1 port=5432 user=tpaa dbname={database}"
          --evidence evidence/m0-exit/postgres-cold-start.json

      - name: Upload PostgreSQL Exit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-m0-exit-postgres-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/m0-exit/
          if-no-files-found: error
          retention-days: 14

      - name: Upload M1 Batch 2 PostgreSQL parity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-m1-batch-2-postgres-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/m1-batch-2/postgres/storage-parity.json
          if-no-files-found: error
          retention-days: 14

  m1-batch-2-review:
    name: M1 Batch 2 Review
    needs:
      - m0-cross-platform
      - m0-logical-equivalence
      - m0-exit-postgres
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Download Windows Linux Batch 2 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tpaa-ci-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded/platform
          merge-multiple: true

      - name: Download Batch 2 service logical equivalence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tpaa-logical-equivalence-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded/logical

      - name: Download Batch 2 PostgreSQL parity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tpaa-m1-batch-2-postgres-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded/postgres

      - name: Aggregate all 18 Batch 2 acceptance rows
        run: >-
          python tools/dev/tpaa_dev.py m1-batch-2-review
          --expected-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --windows-backend downloaded/platform/evidence/m1-batch-2/windows/backend.json
          --linux-backend downloaded/platform/evidence/m1-batch-2/linux/backend.json
          --windows-service downloaded/platform/evidence/m1-batch-2/windows/service-smoke.json
          --linux-service downloaded/platform/evidence/m1-batch-2/linux/service-smoke.json
          --service-logical downloaded/logical/m1-batch-2-service-logical-equivalence.json
          --storage-parity downloaded/postgres/storage-parity.json
          --output evidence/m1-batch-2/review.json

      - name: Upload M1 Batch 2 Review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-m1-batch-2-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/m1-batch-2/review.json
          if-no-files-found: error
          retention-days: 30

  m0-exit-review:
    name: M0 Exit Review
    needs:
      - m0-cross-platform
      - m0-logical-equivalence
      - m0-exit-postgres
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Download Windows/Linux evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tpaa-ci-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded/platform
          merge-multiple: true

      - name: Download logical-equivalence evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tpaa-logical-equivalence-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded/logical

      - name: Download PostgreSQL Exit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tpaa-m0-exit-postgres-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded/postgres

      - name: Aggregate all 14 M0 Exit Gates
        run: >-
          python tools/ci/m0_exit_review.py
          --expected-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --artifact-root downloaded/platform
          --windows-ci downloaded/platform/evidence/ci/windows.json
          --linux-ci downloaded/platform/evidence/ci/linux.json
          --logical downloaded/logical/logical-equivalence.json
          --windows-cold-start downloaded/platform/evidence/devops/windows/cold-start.json
          --linux-cold-start downloaded/platform/evidence/devops/linux/cold-start.json
          --postgres-bootstrap downloaded/postgres/postgres-bootstrap.json
          --postgres-repository downloaded/postgres/postgres-repository.json
          --postgres-cold-start downloaded/postgres/postgres-cold-start.json
          --output evidence/m0-exit/review.json

      - name: Verify or activate M1 Entry
        run: >-
          python tools/dev/tpaa_dev.py m1-entry-activation
          --mode auto
          --event-name ${{ github.event_name }}
          --git-ref ${{ github.ref }}
          --source-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --windows-manifest downloaded/platform/evidence/m1-entry/windows/build-manifest.json
          --linux-manifest downloaded/platform/evidence/m1-entry/linux/build-manifest.json
          --output evidence/m1-entry/activation.json

      - name: Upload M0 Exit Review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-m0-exit-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/m0-exit/review.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload M1 Entry activation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-m1-entry-activation-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/m1-entry/activation.json
          if-no-files-found: error
          retention-days: 30
