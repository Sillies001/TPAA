name: Cross-platform CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-cross-platform:
    name: M0 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            desktop_profile: LINUX_DESKTOP_X64
            service_profile: LINUX_SERVICE_X64
          - platform: windows
            runner: windows-2025
            desktop_profile: WINDOWS_DESKTOP_X64
            service_profile: WINDOWS_SERVICE_X64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install Linux Qt runtime dependency
        if: ${{ matrix.platform == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1

      - name: Synchronize frozen project dependencies
        run: uv sync --locked --python 3.13.5

      - name: Verify dependency lock
        run: uv lock --check

      - name: Verify CI orchestration contract
        run: uv run --locked python tools/dev/tpaa_dev.py verify-ci

      - name: Run governed M0 cross-platform gates
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py ci-check
          --expected-platform ${{ matrix.platform }}
          --evidence evidence/ci/${{ matrix.platform }}.json

      - name: Emit M0 build evidence
        run: |
          uv run --locked python tools/dev/tpaa_dev.py manifest --profile ${{ matrix.desktop_profile }} --output evidence/devops/${{ matrix.platform }}/desktop
          uv run --locked python tools/dev/tpaa_dev.py manifest --profile ${{ matrix.service_profile }} --output evidence/devops/${{ matrix.platform }}/service

      - name: Verify M1 Entry preparation contracts
        run: uv run --locked python tools/dev/tpaa_dev.py verify-m1-entry-preparation

      - name: Verify M1 Entry Gate review state
        run: uv run --locked python tools/dev/tpaa_dev.py verify-m1-entry-gate-state

      - name: Verify M1 detailed-design runway
        run: uv run --locked python tools/dev/tpaa_dev.py verify-m1-detailed-design

      - name: Emit M1-TST-001 fixture evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-fixture-check
          --evidence evidence/m1-fixtures/${{ matrix.platform }}/fixture-evidence.json

      - name: Emit M1-DATA-001 source-adapter evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-source-adapter-check
          --evidence evidence/m1-data-001/${{ matrix.platform }}/source-adapter.json

      - name: Emit M2-DATA-001 reference-truth evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-reference-truth-check
          --evidence evidence/m2-data-001/${{ matrix.platform }}/reference-truth.json

      - name: Emit M2-DATA-002 time-alignment evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-time-alignment-check
          --evidence evidence/m2-data-002/${{ matrix.platform }}/time-alignment.json

      - name: Emit M2-DATA-003 mission-system evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-mission-system-check
          --evidence evidence/m2-data-003/${{ matrix.platform }}/mission-system.json

      - name: Emit M2-DATA-004 measurement-alignment evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-measurement-alignment-check
          --evidence evidence/m2-data-004/${{ matrix.platform }}/measurement-alignment.json

      - name: Emit M2-DATA-005 fixture-family evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-fixture-family-check
          --evidence evidence/m2-data-005/${{ matrix.platform }}/fixture-family.json

      - name: Emit M2-WORLD-001 reference/time World evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-reference-time-world-check
          --evidence evidence/m2-world-001/${{ matrix.platform }}/reference-time-world.json

      - name: Emit M2-WORLD-002 RADAR sensor World evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-radar-sensor-world-check
          --evidence evidence/m2-world-002/${{ matrix.platform }}/radar-sensor-world.json

      - name: Emit M2-WORLD-003 Stage/World lineage evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-stage-world-lineage-check
          --evidence evidence/m2-world-003/${{ matrix.platform }}/stage-world-lineage.json

      - name: Emit M3-WORLD-001 WVR Stage/World/Event evidence
        run: >-
          uv run --locked python tools/testing/m3_wvr_world_check.py
          --evidence evidence/m3-world-001/${{ matrix.platform }}/wvr-stage-world-event.json

      - name: Emit M3-WORLD-002 BVR Stage/World/Event evidence
        run: >-
          uv run --locked python tools/testing/m3_bvr_world_check.py
          --evidence evidence/m3-world-002/${{ matrix.platform }}/bvr-stage-world-event.json

      - name: Emit M3-WORLD-003 Strike Stage/World/Event evidence
        run: >-
          uv run --locked python tools/testing/m3_strike_world_check.py
          --evidence evidence/m3-world-003/${{ matrix.platform }}/strike-stage-world-event.json

      - name: Emit M3-WORLD-004 mission-product applicability evidence
        run: >-
          uv run --locked python tools/testing/m3_mission_product_applicability_check.py
          --evidence evidence/m3-world-004/${{ matrix.platform }}/mission-product-applicability.json

      - name: Emit M3-WORLD-005 four-training fixture-family evidence
        run: >-
          uv run --locked python tools/testing/m3_fixture_family_check.py check
          --evidence evidence/m3-world-005/${{ matrix.platform }}/fixture-family.json

      - name: Emit M3-MET-001 integrated general Metric Engine evidence
        run: >-
          uv run --locked python tools/testing/m3_general_metric_engine_check.py check
          --evidence evidence/m3-met-001/${{ matrix.platform }}/general-engine.json

      - name: Emit M3-MET-002 AIR remainder evidence
        run: >-
          uv run --locked python tools/testing/m3_air_remainder_check.py check
          --evidence evidence/m3-met-002/${{ matrix.platform }}/air-remainder.json

      - name: Emit M3-MET-003 TRK remainder evidence
        run: >-
          uv run --locked python tools/testing/m3_track_remainder_check.py check
          --evidence evidence/m3-met-003/${{ matrix.platform }}/track-remainder.json

      - name: Emit M3-MET-004 ID remainder evidence
        run: >-
          uv run --locked python tools/testing/m3_identification_remainder_check.py check
          --evidence evidence/m3-met-004/${{ matrix.platform }}/identification-remainder.json

      - name: Emit M3-MET-005 passive remainder evidence
        run: >-
          uv run --locked python tools/testing/m3_passive_remainder_check.py check
          --evidence evidence/m3-met-005/${{ matrix.platform }}/passive-remainder.json

      - name: Emit M3-MET-006 ESM remainder evidence
        run: >-
          uv run --locked python tools/testing/m3_esm_remainder_check.py check
          --evidence evidence/m3-met-006/${{ matrix.platform }}/esm-remainder.json

      - name: Emit M3-MET-007 datalink remainder evidence
        run: >-
          uv run --locked python tools/testing/m3_datalink_remainder_check.py check
          --evidence evidence/m3-met-007/${{ matrix.platform }}/datalink-remainder.json

      - name: Emit M3-MET-008 fusion remainder evidence
        run: >-
          uv run --locked python tools/testing/m3_fusion_remainder_check.py check
          --evidence evidence/m3-met-008/${{ matrix.platform }}/fusion-remainder.json

      - name: Emit M3-MET-009 runtime closure evidence
        run: >-
          uv run --locked python tools/testing/m3_runtime_closure_check.py check
          --evidence evidence/m3-met-009/${{ matrix.platform }}/runtime-closure.json

      - name: Emit M3-OBS-001 publication routing evidence
        run: >-
          uv run --locked python tools/testing/m3_publication_routing_check.py check
          --evidence evidence/m3-obs-001/${{ matrix.platform }}/publication-routing.json

      - name: Emit M3-OBS-002 immutable Release evidence
        run: >-
          uv run --locked python tools/testing/m3_immutable_release_check.py check
          --evidence evidence/m3-obs-002/${{ matrix.platform }}/immutable-release.json

      - name: Emit M2-MET-001 general Metric Engine evidence
        run: >-
          uv run --locked python tools/testing/m2_general_metric_engine_check.py
          --evidence evidence/m2-met-001/${{ matrix.platform }}/general-engine.json

      - name: Emit M2-MET-002 incremental QA foundation evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-qa-foundation-incremental-check
          --evidence evidence/m2-met-002/${{ matrix.platform }}/qa-incremental.json

      - name: Emit M2-MET-003 AIR formal-delivery evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-air-formal-delivery-check
          --evidence evidence/m2-met-003/${{ matrix.platform }}/air-formal-delivery.json

      - name: Emit M2-MET-004 SNS detection evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-sns-detection-check
          --evidence evidence/m2-met-004/${{ matrix.platform }}/sns-detection.json

      - name: Emit incremental M2-MET-005 SNS accuracy evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-sns-accuracy-incremental-check
          --evidence evidence/m2-met-005/${{ matrix.platform }}/sns-accuracy-incremental.json

      - name: Emit incremental M2-MET-006 runtime-contract evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-runtime-contract-incremental-check
          --evidence evidence/m2-met-006/${{ matrix.platform }}/runtime-contract-incremental.json

      - name: Emit incremental M2-MET-007 batch/replay evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-batch-replay-incremental-check
          --evidence evidence/m2-met-007/${{ matrix.platform }}/batch-replay-incremental.json

      - name: Emit M2 Batch 2 authority-gap sentinel evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-authority-gap-sentinel-check
          --evidence evidence/m2-authority-gap/${{ matrix.platform }}/sentinel.json

      - name: Emit M2-OBS-001 publication-routing evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-publication-routing-check
          --evidence evidence/m2-obs-001/${{ matrix.platform }}/publication-routing.json

      - name: Emit M2-OBS-002 immutable Release evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-immutable-release-check
          --evidence evidence/m2-obs-002/${{ matrix.platform }}/immutable-release.json

      - name: Emit M2-OBS-003 idempotent publication/replay evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-idempotent-publication-check
          --evidence evidence/m2-obs-003/${{ matrix.platform }}/publication-replay.json

      - name: Emit M2-GUI-001 foundation-navigation evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-gui-foundation-navigation-check
          --evidence evidence/m2-gui-001/${{ matrix.platform }}/foundation-navigation.json

      - name: Emit M2-GUI-002 observation-lane presentation evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-gui-observation-lane-check
          --evidence evidence/m2-gui-002/${{ matrix.platform }}/observation-lane.json

      - name: Emit M2-GUI-003 state UX evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-gui-state-ux-check
          --evidence evidence/m2-gui-003/${{ matrix.platform }}/state-ux.json

      - name: Emit M2-TST-001 Catalog coverage evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-catalog-coverage-check
          --evidence evidence/m2-tst-001/${{ matrix.platform }}/catalog-coverage.json

      - name: Emit M2-TST-002 QA/AIR Golden-negative evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-qa-air-golden-check
          --evidence evidence/m2-tst-002/${{ matrix.platform }}/qa-air-golden-negative.json

      - name: Emit M2-TST-003 SNS Golden-applicability evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-sns-golden-check
          --evidence evidence/m2-tst-003/${{ matrix.platform }}/sns-golden-applicability.json

      - name: Emit M2-TST-004 Release-history-replay evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m2-release-history-replay-check
          --evidence evidence/m2-tst-004/${{ matrix.platform }}/release-history-replay.json

      - name: Emit M1-DATA-002 source-registry evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-source-registry-check
          --evidence evidence/m1-data-002/${{ matrix.platform }}/source-registry.json

      - name: Emit M1-DATA-003 Session Time evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-session-time-check
          --evidence evidence/m1-data-003/${{ matrix.platform }}/session-time.json

      - name: Emit M1-DATA-004 aircraft-identity evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-aircraft-identity-check
          --evidence evidence/m1-data-004/${{ matrix.platform }}/aircraft-identity.json

      - name: Emit M1-DATA-005 Canonical-flight-channel evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-canonical-flight-channels-check
          --evidence evidence/m1-data-005/${{ matrix.platform }}/canonical-flight-channels.json

      - name: Emit M1-DATA-006 Evaluation Context evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-evaluation-context-check
          --evidence evidence/m1-data-006/${{ matrix.platform }}/evaluation-context.json

      - name: Emit M1-DATA-007 lineage-quality evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-lineage-quality-check
          --evidence evidence/m1-data-007/${{ matrix.platform }}/lineage-quality.json

      - name: Emit M1-WORLD-001 Basic Episode evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-basic-episode-check
          --evidence evidence/m1-world-001/${{ matrix.platform }}/basic-episode.json

      - name: Emit M1-WORLD-002 BASIC_FLIGHT_V1 Stage evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-basic-stage-check
          --evidence evidence/m1-world-002/${{ matrix.platform }}/basic-stage.json

      - name: Emit M1-WORLD-003 Stage quality/status evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-stage-quality-check
          --evidence evidence/m1-world-003/${{ matrix.platform }}/stage-quality.json

      - name: Emit consolidated M1 Batch 1 core evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-1-core-check
          --evidence evidence/m1-batch-1/${{ matrix.platform }}/core-product.json

      - name: Emit M1 Batch 2 service smoke evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-2-service-smoke
          --expected-platform ${{ matrix.platform }}
          --source-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence evidence/m1-batch-2/${{ matrix.platform }}/service-smoke.json

      - name: Emit consolidated M1 Batch 2 backend evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-2-backend-check
          --platform ${{ matrix.platform }}
          --source-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence evidence/m1-batch-2/${{ matrix.platform }}/backend.json

      - name: Emit M1 Batch 3 Desktop E2E evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-3-desktop-e2e
          --expected-platform ${{ matrix.platform }}
          --source-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence evidence/m1-batch-3/${{ matrix.platform }}/desktop-e2e.json

      - name: Emit integrated M1 Batch 4 platform qualification
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-batch-4-platform-check
          --batch1 evidence/m1-batch-1/${{ matrix.platform }}/core-product.json
          --batch2-service evidence/m1-batch-2/${{ matrix.platform }}/service-smoke.json
          --batch3-desktop evidence/m1-batch-3/${{ matrix.platform }}/desktop-e2e.json
          --expected-revision ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence evidence/m1-batch-4/${{ matrix.platform }}/platform.json

      - name: Emit M1 Entry build-manifest candidate
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py m1-entry-manifest
          --profile ${{ matrix.desktop_profile }}
          --output evidence/m1-entry/${{ matrix.platform }}/build-manifest.json

      - name: Build M0 development packages
        run: |
          uv run --locked python tools/dev/tpaa_dev.py package --profile ${{ matrix.desktop_profile }} --output dist
          uv run --locked python tools/dev/tpaa_dev.py package --profile ${{ matrix.service_profile }} --output dist

      - name: Emit M0 fixture framework evidence
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py fixture-check
          --evidence evidence/tests/framework-${{ matrix.platform }}.json

      - name: Emit platform logical product
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py platform-logical-product
          --output evidence/cross-platform/${{ matrix.platform }}.json

      - name: Upload M0 CI, Step 9 and Step 10 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-ci-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/ci/${{ matrix.platform }}.json
            evidence/tests/framework-${{ matrix.platform }}.json
            evidence/cross-platform/${{ matrix.platform }}.json
            evidence/devops/${{ matrix.platform }}
            evidence/m1-entry/${{ matrix.platform }}/build-manifest.json
            evidence/m1-fixtures/${{ matrix.platform }}/fixture-evidence.json
            evidence/m1-data-001/${{ matrix.platform }}/source-adapter.json
            evidence/m2-data-001/${{ matrix.platform }}/reference-truth.json
            evidence/m2-data-002/${{ matrix.platform }}/time-alignment.json
            evidence/m2-data-003/${{ matrix.platform }}/mission-system.json
            evidence/m2-data-004/${{ matrix.platform }}/measurement-alignment.json
            evidence/m2-data-005/${{ matrix.platform }}/fixture-family.json
            evidence/m2-world-001/${{ matrix.platform }}/reference-time-world.json
            evidence/m2-world-002/${{ matrix.platform }}/radar-sensor-world.json
            evidence/m2-world-003/${{ matrix.platform }}/stage-world-lineage.json
            evidence/m3-world-001/${{ matrix.platform }}/wvr-stage-world-event.json
            evidence/m3-world-002/${{ matrix.platform }}/bvr-stage-world-event.json
            evidence/m3-world-003/${{ matrix.platform }}/strike-stage-world-event.json
            evidence/m3-world-004/${{ matrix.platform }}/mission-product-applicability.json
            evidence/m3-world-005/${{ matrix.platform }}/fixture-family.json
            evidence/m3-met-001/${{ matrix.platform }}/general-engine.json
            evidence/m3-met-002/${{ matrix.platform }}/air-remainder.json
            evidence/m3-met-003/${{ matrix.platform }}/track-remainder.json
            evidence/m3-met-004/${{ matrix.platform }}/identification-remainder.json
            evidence/m3-met-005/${{ matrix.platform }}/passive-remainder.json
            evidence/m3-met-006/${{ matrix.platform }}/esm-remainder.json
            evidence/m3-met-007/${{ matrix.platform }}/datalink-remainder.json
            evidence/m3-met-008/${{ matrix.platform }}/fusion-remainder.json
            evidence/m3-met-009/${{ matrix.platform }}/runtime-closure.json
            evidence/m3-obs-001/${{ matrix.platform }}/publication-routing.json
            evidence/m3-obs-002/${{ matrix.platform }}/immutable-release.json
            evidence/m2-met-001/${{ matrix.platform }}/general-engine.json
            evidence/m2-met-002/${{ matrix.platform }}/qa-incremental.json
            evidence/m2-met-003/${{ matrix.platform }}/air-formal-delivery.json
            evidence/m2-met-004/${{ matrix.platform }}/sns-detection.json
            evidence/m2-met-005/${{ matrix.platform }}/sns-accuracy-incremental.json
            evidence/m2-met-006/${{ matrix.platform }}/runtime-contract-incremental.json
            evidence/m2-met-007/${{ matrix.platform }}/batch-replay-incremental.json
            evidence/m2-authority-gap/${{ matrix.platform }}/sentinel.json
            evidence/m2-obs-001/${{ matrix.platform }}/publication-routing.json
            evidence/m2-obs-002/${{ matrix.platform }}/immutable-release.json
            evidence/m2-obs-003/${{ matrix.platform }}/publication-replay.json
            evidence/m2-gui-001/${{ matrix.platform }}/foundation-navigation.json
            evidence/m2-gui-002/${{ matrix.platform }}/observation-lane.json
            evidence/m2-gui-003/${{ matrix.platform }}/state-ux.json
            evidence/m2-tst-001/${{ matrix.platform }}/catalog-coverage.json
            evidence/m2-tst-002/${{ matrix.platform }}/qa-air-golden-negative.json
            evidence/m2-tst-003/${{ matrix.platform }}/sns-golden-applicability.json
            evidence/m2-tst-004/${{ matrix.platform }}/release-history-replay.json
            evidence/m1-data-002/${{ matrix.platform }}/source-registry.json
            evidence/m1-data-003/${{ matrix.platform }}/session-time.json
            evidence/m1-data-004/${{ matrix.platform }}/aircraft-identity.json
            evidence/m1-data-005/${{ matrix.platform }}/canonical-flight-channels.json
            evidence/m1-data-006/${{ matrix.platform }}/evaluation-context.json
            evidence/m1-data-007/${{ matrix.platform }}/lineage-quality.json
            evidence/m1-world-001/${{ matrix.platform }}/basic-episode.json
            evidence/m1-world-002/${{ matrix.platform }}/basic-stage.json
            evidence/m1-world-003/${{ matrix.platform }}/stage-quality.json
            evidence/m1-batch-1/${{ matrix.platform }}/core-product.json
            evidence/m1-batch-2/${{ matrix.platform }}/service-smoke.json
            evidence/m1-batch-2/${{ matrix.platform }}/backend.json
            evidence/m1-batch-3/${{ matrix.platform }}/desktop-e2e.json
            evidence/m1-batch-4/${{ matrix.platform }}/platform.json
            dist/
          if-no-files-found: error
          retention-days: 14

  m0-logical-equivalence:
    name: M0 logical equivalence
    needs: m0-cross-platform
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Download platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tpaa-ci-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Compare Windows and Linux logical products
        run: >-
          python tools/dev/tpaa_dev.py compare-platform-logical
          --windows downloaded/evidence/cross-platform/windows.json
          --linux downloaded/evidence/cross-platform/linux.json
          --evidence evidence/cross-platform/logical-equivalence.json

      - name: Compare Windows and Linux M2 fixture family
        run: >-
          python tools/dev/tpaa_dev.py m2-fixture-family-compare
