  m0-logical-equivalence:
    name: M0 logical equivalence
    needs:
      - m0-cross-platform
      - m0-exit-postgres
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Download platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tpaa-ci-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded
          merge-multiple: true

      - name: Download M4 platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tpaa-m4-platform-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded/m4
          merge-multiple: true

      - name: Download M5 Batch 2 platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
