name: Cross-platform CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-cross-platform:
    name: M0 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install Linux Qt runtime dependency
        if: ${{ matrix.platform == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1

      - name: Synchronize frozen project dependencies
        run: uv sync --locked --python 3.13.5

      - name: Verify dependency lock
        run: uv lock --check

      - name: Verify CI orchestration contract
        run: uv run --locked python tools/dev/tpaa_dev.py verify-ci

      - name: Run governed M0 cross-platform gates
        run: >-
          uv run --locked python tools/dev/tpaa_dev.py ci-check
          --expected-platform ${{ matrix.platform }}
          --evidence evidence/ci/${{ matrix.platform }}.json

      - name: Upload CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpaa-ci-${{ matrix.platform }}-${{ github.sha }}
          path: evidence/ci/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
